{% extends "base.html" %}
{% block title %}Login — BookNest{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4"><div class="big-icon">🔐</div><h2>Welcome back</h2><p class="text-muted">Sign in to reserve books.</p></div>
    <form method="post">
      <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
      <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required>
      <button class="btn btn-dark w-100 btn-lg">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
